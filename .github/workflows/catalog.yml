name: catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 条目目录是事实源，清单是生成物：这里只校验同步，不在 CI 里回写。
      - run: node scripts/build-catalog.mjs --check

  purge:
    # 实测客户端 astravia-ui-design 0.7.2 的取数顺序是 jsDelivr 在前、raw 在后，
    # 所以 jsDelivr 仍发旧版本时 raw 根本不会被请求——purge 才是更新生效的关键路径。
    # （仓库地址从 sikongyue 改到 maomaochong-ai 时这里漏改，导致改名后的几次 push
    # 都刷到了不存在/无效的路径。）
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache
        run: |
          set -euo pipefail
          URL="https://purge.jsdelivr.net/gh/maomaochong-ai/astravia-design-system-templates@main/.astravia/design-templates.json"
          echo "purging $URL"
          curl -sS --fail --max-time 60 "$URL" | tee /tmp/purge.json
          echo
          # purge 是尽力而为：失败不该让整条流水线红。
          grep -q '"status": *"finished"' /tmp/purge.json || echo "::warning::jsDelivr purge did not report finished"
        continue-on-error: true
